spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/demand_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.packages-to-scan=com.demand.demo,com.inventory.demo.entity

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

architecture=micro

service.inventory.url=http://localhost:8080
service.order.url=http://localhost:8082

server.port=8081
spring.kafka.bootstrap-servers=localhost:9092

# ---------- Consumer ----------
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
app.topic.create-owner-topic=CREATE_OWNER_TOPIC
app.topic.create-product-topic=CREATE_PRODUCT_TOPIC

spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000

# General Kafka Properties
spring.kafka.properties.security.protocol=PLAINTEXT